<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gawr Gura Song Randomizer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b132b; color: #ffffff; text-align: center; padding: 20px; }
        .card { max-width: 500px; margin: 40px auto; background: #1c2541; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #48cae4; color: #000; font-weight: bold; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        button:hover { background: #90e0ef; }
        iframe { width: 100%; height: 280px; border-radius: 8px; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🦈 Gawr Gura Jukebox</h1>
        <button onclick="playRandomSong()">Play Random Song</button>
        <div id="player-container" style="display:none;">
            <h3 id="song-title"></h3>
            <iframe id="video-frame" src="" allow="autoplay" allowfullscreen></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
